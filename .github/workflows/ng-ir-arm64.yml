# ng-ir-arm64: Hive NG lane ng-ir gate on a GitHub-hosted ubuntu-24.04-arm machine (LANE-NG CI convention).
# Births omc from the seed and requires the committed seed/out/omc.sha256, builds seed/ng/gate-ir.om with that omc and
# runs it: it builds ngbuild, ngcheck, ngas, ngdis and ng (pins of seed/ng/ng.units), checks the host word table and the
# pin refusal, runs seed/ng/tests/ir/cases, its negative controls and tool mutants. The run lines are glue only (birth
# omc, compare its digest, build the gate with cat and omc, start it); every check lives in the .om gate.
# Paths: all of seed/ (omc's bootstrap closure, the pinned compiler and the ng tree) and this file.
name: ng-ir-arm64
on:
  pull_request:
    paths: ["seed/**", ".github/workflows/ng-ir-arm64.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ng-ir:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: machine
        run: uname -a; nproc
      - name: omc born from the seed
        run: sh seed/omega-from-seed.sh
      - name: omc equals the committed seed/out/omc.sha256
        run: git diff --exit-code seed/out/omc.sha256
      - name: build the ng-ir gate
        run: cat seed/ng/sha256.om seed/ng/gate-ir.om | seed/out/omc > ../gate-ir && chmod +x ../gate-ir
      - name: gate seed/ng/tests/ir/cases
        run: ../gate-ir seed/out/omc ../ng-ir-gate
