# ng-front-arm64: Hive NG lane ng-front gate on a GitHub-hosted ubuntu-24.04-arm machine (LANE-NG CI convention).
# Births omc from the seed and requires the committed seed/out/omc.sha256, builds seed/ng/front/gate-front.om with that omc
# and runs it: the checker seed/ng/src/front.om + seed/ng/front/check.om must give the same exit code and stderr as omc on
# every case (seed/ng/front/cases-front.txt, cases-om2.txt, cases-tests.txt and the C2 manifest), the declared beyond and scope rows must
# all be used, and every mutant of seed/ng/front/mutants.txt must be KILLED. All logic lives in the .om gate.
name: ng-front-arm64
on:
  pull_request:
    paths: ["seed/ng/src/front.om", "seed/ng/front/**", "seed/omc/omc.om", "seed/omc/tests/**", "seed/omc/om2/**", "seed/qualification/om2/**", ".github/workflows/ng-front-arm64.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ng-front:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: machine
        run: uname -a; nproc
      - name: omc born from the seed
        run: sh seed/omega-from-seed.sh
      - name: omc equals the committed seed/out/omc.sha256
        run: git diff --exit-code seed/out/omc.sha256
      - name: build the ng-front gate
        run: seed/out/omc < seed/ng/front/gate-front.om > ../gate-front && chmod +x ../gate-front
      - name: gate front.om against omc
        run: ../gate-front seed/out/omc 5f90edea61bac241398df5036990d899361a5acd9decb37954ce088ec0f6f6df seed/ng/src/front.om+seed/ng/front/check.om seed/ng/front/declared.txt seed/ng/front/mutants.txt ../ng-front-gate seed/ng/front/cases-front.txt seed/ng/front/cases-om2.txt seed/ng/front/cases-tests.txt seed/qualification/om2/manifest-c2.txt
