# ng-front-arm64: Hive NG lane ng-front gate on a GitHub-hosted ubuntu-24.04-arm machine (LANE-NG CI convention).
# Births omc from the seed and requires the committed seed/out/omc.sha256, builds ng through ngbuild (the sha256 pins of
# seed/ng/ng.units), builds seed/ng/front/gate-front.om and runs it: ng in mode `@ng front-check` must give the same exit
# code and stderr as omc on every case (seed/ng/front/cases-front.txt, cases-om2.txt, cases-tests.txt and the C2 manifest),
# the declared beyond, scope and ngonly rows must all be used with omc's declared exit, and every mutant of
# seed/ng/front/mutants.txt must be KILLED. The checker the gate built must be byte-for-byte the ng that ngbuild built.
# All logic lives in the .om tools; every run line is one invocation.
name: ng-front-arm64
on:
  pull_request:
    paths: ["seed/ng/src/**", "seed/ng/ng.units", "seed/ng/front/**", "seed/omc/omc.om", "seed/omc/tests/**", "seed/omc/om2/**", "seed/qualification/om2/**", ".github/workflows/ng-front-arm64.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ng-front:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: machine
        run: uname -a; nproc
      - name: omc born from the seed
        run: sh seed/omega-from-seed.sh
      - name: omc equals the committed seed/out/omc.sha256
        run: git diff --exit-code seed/out/omc.sha256
      - name: build ngbuild
        run: cat seed/ng/sha256.om seed/ng/ngbuild.om | seed/out/omc > ../ngbuild && chmod +x ../ngbuild
      - name: ng from the pinned units of seed/ng/ng.units
        run: ../ngbuild build seed/out/omc seed/ng/ng.units ../ng
      - name: build the ng-front gate
        run: seed/out/omc < seed/ng/front/gate-front.om > ../gate-front && chmod +x ../gate-front
      - name: gate ng @ng front-check against omc
        run: ../gate-front seed/out/omc 5f90edea61bac241398df5036990d899361a5acd9decb37954ce088ec0f6f6df seed/ng/src/ir.om+seed/ng/src/front.om+seed/ng/src/main.om+in:seed/ng/front/front-check.in seed/ng/front/declared.txt seed/ng/front/mutants.txt ../ng-front-gate seed/ng/front/cases-front.txt seed/ng/front/cases-om2.txt seed/ng/front/cases-tests.txt seed/qualification/om2/manifest-c2.txt
      - name: the gate's checker is the ngbuild ng
        run: cmp ../ng ../ng-front-gate/fecheck
