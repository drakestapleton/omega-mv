# ng-gpu-arm64: Hive NG lane ng-gpu gate on a GitHub-hosted ubuntu-24.04-arm machine (LANE-NG CI convention).
# Births omc from the seed and requires the committed seed/out/omc.sha256, builds seed/qualification/om2/gate.om with
# that omc and runs seed/ng/gpu/gate.cases. The units ng composes are in this repository under gpu/nvidia/ (moved from
# CUDApp at the commit in seed/ng/cudapp.lock, ADR 0047), so no CUDApp checkout is made. All logic lives in the .om
# gate; every run line is one invocation.
name: ng-gpu-arm64
on:
  pull_request:
    paths: ["seed/ng/gpu/**", "seed/ng/src/gpu.om", "seed/ng/cudapp.lock", "gpu/nvidia/**", "om/sha256/sha256-om2.om", "seed/qualification/om2/gate.om", ".github/workflows/ng-gpu-arm64.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ng-gpu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: machine
        run: uname -a; nproc
      - name: omc born from the seed
        run: sh seed/omega-from-seed.sh
      - name: omc equals the committed seed/out/omc.sha256
        run: git diff --exit-code seed/out/omc.sha256
      - name: build the om2 gate driver
        run: seed/out/omc < seed/qualification/om2/gate.om > ../gate && chmod +x ../gate
      - name: gate seed/ng/gpu/gate.cases
        run: ../gate seed/out/omc "$(cut -c1-64 seed/out/omc.sha256)" seed/ng/gpu/gate.cases ../ng-gpu-gate
