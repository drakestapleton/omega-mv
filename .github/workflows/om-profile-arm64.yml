# om-profile-arm64: DRA-419 critical source profile on a GitHub-hosted ubuntu-24.04-arm machine with the
# pinned omc (om/units.sh OMC_PIN): seed/profile/check.sh runs the rule fixtures, capacity and stop rows,
# one profile.om mutant per rule (five for B2), the authority unit profile, the seven authority regression
# gates and the two pre-fix negative controls.
# Weekly schedule catches drift in seed/effects/effects.om or the authority modules that PR paths miss.
# Advisory, like AIEN Checks: GitHub gates no merge (Alpha does).
name: om-profile-arm64
on:
  pull_request:
    paths: ["seed/profile/**", "seed/authority/**", "seed/effects/effects.om", "seed/qualification/om2/gate.om", "seed/out/omc", "om/units.sh", ".github/workflows/om-profile-arm64.yml"]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  om-profile:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: machine
        run: uname -a; nproc
      - name: omc pin
        run: |
          pin=$(sed -n 's/^OMC_PIN=//p' om/units.sh | tr -d '"')
          got=$(sha256sum seed/out/omc | cut -c1-64)
          echo "pin $pin"; echo "got $got"
          [ "$pin" = "$got" ] || { echo "seed/out/omc does not match OMC_PIN"; exit 1; }
          chmod +x seed/out/omc
      - name: critical profile and authority gates
        run: mkdir -p build && sh seed/profile/check.sh 2>&1 | tee build/om-profile.log; test "${PIPESTATUS[0]}" = 0
        shell: bash
      - name: logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: om-profile-arm64-logs
          path: |
            build/om-profile.log
            build/seed/profile/*.log
            build/seed/profile/*.out
            build/seed/profile/unit.txt
