# irequiv-arm64: runs seed/equiv/gate-irequiv.sh on a GitHub-hosted ubuntu-24.04-arm machine. The gate
# pins seed/out/omc, checks that the irequiv/irspirv/irwasm readers have not drifted (irwasm = v1 reader
# plus seed/equiv/irwasm-v7.sed), compares reader verdicts, runs the exhaustive equivalence fixtures and
# their mutants, and checks irequiv eval against native AArch64 programs on 140 table rows. Host CPU
# only, about 10 s; no tool beyond the committed omc and POSIX sh/sed/cmp/od. A SKIP line is not a pass.
# Advisory, like AIEN Checks: GitHub gates no merge (Alpha does).
name: irequiv-arm64
on:
  pull_request:
    paths: ["seed/equiv/**", "seed/wasm/**", "seed/spirv/**", "seed/out/omc", "tests/one_layer/omegese/dev/**", ".github/workflows/irequiv-arm64.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  irequiv:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: gate-irequiv
        run: |
          set +e
          sh seed/equiv/gate-irequiv.sh > gate.out 2>&1
          rc=$?
          set -e
          cat gate.out
          test "$rc" = 0
          grep -q '^READERS units=\([0-9]*\) agree=\1$' gate.out
          grep -qx 'CONFORM native rows=140 equal=140' gate.out
          grep -qx 'GATE-IREQUIV PASS' gate.out
