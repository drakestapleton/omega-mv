# gen-protocol-arm64: `make test-gen-protocol` (GEN-1 pins, gencheck, genstats, famsig, dev pack) on a
# GitHub-hosted ubuntu-24.04-arm machine, not the Spark. famsig and gencheck link the seeded SHA-256 unit
# src/omega_om_units.c, which is AArch64 machine code, so the x86_64 AIEN Checks job cannot build them.
# The GEN protocol pins (tests/one_layer/generalization/protocol.json) hash docs and tools that other PRs
# edit; OMEGESE.md drifted from #970 to #1015 with no check failing. So this runs on every pull request,
# with no path filter. CPU only. Advisory, like AIEN Checks: GitHub gates no merge (Alpha does).
name: gen-protocol-arm64
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gen-protocol:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: machine
        run: uname -a; nproc; cc --version | head -1
      - name: test-gen-protocol
        # shell: bash runs `bash -eo pipefail`, so a failing make fails the step through the tee.
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/genp"
          make test-gen-protocol 2>&1 | tee "$RUNNER_TEMP/genp/test-gen-protocol.log"
      - name: Keep the test-gen-protocol log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-gen-protocol
          path: ${{ runner.temp }}/genp/
          if-no-files-found: ignore
