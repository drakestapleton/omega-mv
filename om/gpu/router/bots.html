<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Omega Concurrent Bot Deck — DGX Spark GB10</title>
<style>
:root {
  color-scheme: dark light;
  --bg-dark: #0b0e14;
  --bg-light: #f5f7fb;
  --surface-dark: #121722;
  --surface-light: #ffffff;
  --surface-2-dark: #182030;
  --surface-2-light: #eef2f8;
  --border-dark: #253047;
  --border-light: #d0d8e6;
  --text-dark: #e6edf7;
  --text-light: #161d2b;
  --muted-dark: #8c9bb8;
  --muted-light: #55637d;
  --accent-dark: #4fd1c5;
  --accent-light: #0d7a72;
  --accent-ink-dark: #07191a;
  --accent-ink-light: #ffffff;
  --danger-dark: #f87171;
  --danger-light: #c81e1e;
  --ok-dark: #34d399;
  --ok-light: #047857;
  --warn-dark: #fbbf24;
  --warn-light: #b45309;
  --thumb-dark: #4f6285;
  --thumb-light: #7c8aa3;
  --track-dark: #111622;
  --track-light: #e5eaf3;

  --bg: var(--bg-dark);
  --surface: var(--surface-dark);
  --surface-2: var(--surface-2-dark);
  --border: var(--border-dark);
  --text: var(--text-dark);
  --muted: var(--muted-dark);
  --accent: var(--accent-dark);
  --accent-ink: var(--accent-ink-dark);
  --danger: var(--danger-dark);
  --ok: var(--ok-dark);
  --warn: var(--warn-dark);
  --scrollbar-thumb: var(--thumb-dark);
  --scrollbar-track: var(--track-dark);
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: var(--bg-light);
    --surface: var(--surface-light);
    --surface-2: var(--surface-2-light);
    --border: var(--border-light);
    --text: var(--text-light);
    --muted: var(--muted-light);
    --accent: var(--accent-light);
    --accent-ink: var(--accent-ink-light);
    --danger: var(--danger-light);
    --ok: var(--ok-light);
    --warn: var(--warn-light);
    --scrollbar-thumb: var(--thumb-light);
    --scrollbar-track: var(--track-light);
  }
}

@supports (color: light-dark(white, black)) {
  :root {
    --bg: light-dark(var(--bg-light), var(--bg-dark));
    --surface: light-dark(var(--surface-light), var(--surface-dark));
    --surface-2: light-dark(var(--surface-2-light), var(--surface-2-dark));
    --border: light-dark(var(--border-light), var(--border-dark));
    --text: light-dark(var(--text-light), var(--text-dark));
    --muted: light-dark(var(--muted-light), var(--muted-dark));
    --accent: light-dark(var(--accent-light), var(--accent-dark));
    --accent-ink: light-dark(var(--accent-ink-light), var(--accent-ink-dark));
    --danger: light-dark(var(--danger-light), var(--danger-dark));
    --ok: light-dark(var(--ok-light), var(--ok-dark));
    --warn: light-dark(var(--warn-light), var(--warn-dark));
    --scrollbar-thumb: light-dark(var(--thumb-light), var(--thumb-dark));
    --scrollbar-track: light-dark(var(--track-light), var(--track-dark));
  }
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  min-block-size: 100dvb;
  block-size: 100dvb;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  accent-color: var(--accent);
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  block-size: 100dvb;
  inline-size: 100%;
  overflow: clip;
}

header.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: safe center;
  gap: 0.6rem 0.9rem;
  padding: 0.65rem 1rem;
  background: var(--surface);
  border-block-end: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 700;
  font-size: 0.98rem;
  letter-spacing: 0.01em;
}
.brand-dot {
  inline-size: 0.6rem;
  block-size: 0.6rem;
  border-radius: 999px;
  background: var(--ok);
  flex-shrink: 0;
}

.ctrl-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem;
}
.spacer { margin-inline-start: auto; }

label.inline-lbl {
  font-size: 0.78rem;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

select, button, input, textarea {
  font: inherit;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 0.45rem;
}
select, button {
  padding: 0.34rem 0.62rem;
  font-size: 0.82rem;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: transparent;
  font-weight: 600;
}
button.primary:hover { filter: brightness(1.08); }
button.danger {
  border-color: var(--danger);
  color: var(--danger);
}
button.small {
  padding: 0.2rem 0.45rem;
  font-size: 0.74rem;
}
a.nav-link {
  font-size: 0.8rem;
  color: var(--accent);
  text-decoration: none;
  padding: 0.3rem 0.55rem;
  border: 1px solid var(--border);
  border-radius: 0.45rem;
}
a.nav-link:hover { border-color: var(--accent); }

.pill {
  font-size: 0.74rem;
  padding: 0.22rem 0.55rem;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.pill.live { border-color: var(--ok); color: var(--ok); }
.pill.busy { border-color: var(--warn); color: var(--warn); }

main.deck {
  --cols: 2;
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  grid-auto-rows: minmax(280px, 1fr);
  gap: 0.75rem;
  padding: 0.75rem;
  overflow-y: auto;
  scrollbar-gutter: stable;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
}
@media (max-width: 900px) {
  main.deck { grid-template-columns: minmax(0, 1fr); }
}

.bot-card {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  min-inline-size: 0;
  min-block-size: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 0.65rem;
  overflow: clip;
}
.bot-card.streaming { border-color: var(--accent); }
.bot-card.inactive { opacity: 0.62; }

.bot-hdr {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.45rem 0.6rem;
  background: var(--surface-2);
  border-block-end: 1px solid var(--border);
  min-inline-size: 0;
}
.bot-name {
  flex: 1 1 80px;
  min-inline-size: 0;
  background: transparent;
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 0.85rem;
  padding: 0.15rem 0.3rem;
}
.bot-name:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.bot-model {
  max-inline-size: 165px;
  font-size: 0.74rem;
  padding: 0.2rem 0.35rem;
}

.bot-sys-wrap {
  border-block-end: 1px solid var(--border);
  padding: 0.3rem 0.6rem;
  background: var(--surface);
}
.bot-sys-wrap summary {
  font-size: 0.73rem;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.bot-sys {
  inline-size: 100%;
  margin-block-start: 0.35rem;
  padding: 0.35rem 0.45rem;
  font-size: 0.76rem;
  resize: vertical;
  min-block-size: 2.8rem;
}

.bot-log {
  padding: 0.6rem;
  overflow-y: auto;
  scrollbar-gutter: stable;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  min-inline-size: 0;
}

.msg {
  padding: 0.45rem 0.6rem;
  border-radius: 0.5rem;
  font-size: 0.84rem;
  line-height: 1.48;
  white-space: pre-wrap;
  word-break: break-word;
  min-inline-size: 0;
}
.msg.user {
  align-self: flex-end;
  max-inline-size: 92%;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.msg.assistant {
  align-self: stretch;
  background: transparent;
  border-inline-start: 2px solid var(--accent);
  padding-inline-start: 0.65rem;
}
.msg.error {
  border-inline-start: 2px solid var(--danger);
  color: var(--danger);
}
.msg pre {
  margin: 0.4rem 0;
  padding: 0.5rem;
  border-radius: 0.4rem;
  background: var(--bg);
  border: 1px solid var(--border);
  overflow-x: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.78rem;
}

.bot-foot {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.45rem 0.55rem;
  border-block-start: 1px solid var(--border);
  background: var(--surface-2);
}
.bot-input {
  flex: 1 1 0;
  min-inline-size: 0;
  padding: 0.34rem 0.5rem;
  font-size: 0.82rem;
  background: var(--surface);
}
.bot-input:focus { outline: 1px solid var(--accent); }

footer.command-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: safe center;
  gap: 0.55rem;
  padding: 0.65rem 1rem;
  background: var(--surface);
  border-block-start: 1px solid var(--border);
}
.broadcast-input {
  flex: 1 1 320px;
  min-inline-size: 0;
  padding: 0.48rem 0.65rem;
  font-size: 0.88rem;
  resize: none;
  min-block-size: 2.4rem;
  max-block-size: 6rem;
  background: var(--surface-2);
}
.broadcast-input:focus { outline: 1px solid var(--accent); }

@supports not (scrollbar-color: auto) {
  main.deck, .bot-log { scrollbar-width: auto; }
  main.deck::-webkit-scrollbar, .bot-log::-webkit-scrollbar { width: 8px; height: 8px; }
  main.deck::-webkit-scrollbar-thumb, .bot-log::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
  main.deck::-webkit-scrollbar-track, .bot-log::-webkit-scrollbar-track { background: var(--scrollbar-track); }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" id="healthDot"></span>
      <span>Omega Concurrent Bot Deck</span>
    </div>

    <div class="ctrl-group">
      <label class="inline-lbl">
        Global Model
        <select id="globalModel"></select>
      </label>
      <label class="inline-lbl">
        Max Tok
        <select id="maxTokens">
          <option value="512">512</option>
          <option value="2048" selected>2048</option>
          <option value="4096">4096</option>
          <option value="8192">8192</option>
        </select>
      </label>
    </div>

    <div class="ctrl-group">
      <button type="button" data-preset="2">2 Pair</button>
      <button type="button" data-preset="4">4 Squad</button>
      <button type="button" data-preset="6">6 Grid</button>
      <button type="button" data-preset="8">8 Swarm</button>
      <button type="button" id="addBotBtn">+ Bot</button>
      <button type="button" id="clearAllBtn">Clear All</button>
    </div>

    <div class="ctrl-group spacer">
      <span class="pill" id="modePill">Connecting...</span>
      <span class="pill" id="wavePill">Wave: idle</span>
      <a class="nav-link" href="http://127.0.0.1:3080" target="_blank" rel="noopener">Open WebUI ↗</a>
    </div>
  </header>

  <main class="deck" id="deck"></main>

  <footer class="command-bar">
    <textarea id="broadcastInput" class="broadcast-input" rows="1" placeholder="Broadcast a prompt to all checked bots simultaneously (⌘/Ctrl + Enter)..."></textarea>
    <button type="button" class="primary" id="runAllBtn">⚡ Run All Active Concurrently</button>
    <button type="button" class="danger" id="stopAllBtn">■ Stop All</button>
  </footer>
</div>

<script>
const STORAGE_KEY = "omega_bot_deck_v1";
const PRESET_ROLES = [
  { name: "Architect", sys: "You are a concise systems architect. Focus on clean structure, invariants, and tradeoffs." },
  { name: "Coder", sys: "You are an expert low-level engineer. Provide clean, direct, runnable code with zero fluff." },
  { name: "Critic", sys: "You are a skeptical code and design reviewer. Find edge cases, bugs, race conditions, and hidden costs." },
  { name: "Optimizer", sys: "You are a hardware-first performance engineer. Focus on memory bandwidth, concurrency, and latency floors." },
  { name: "OM-2 Coder (CPU)", model: "omega-llm-15.8m-om2", sys: "" },
  { name: "Researcher", sys: "You explain first principles clearly and verify assumptions step by step." },
  { name: "Tester", sys: "You design adversarial test cases, boundary inputs, and negative controls." },
  { name: "Synthesizer", sys: "You distill complex tradeoffs into an actionable 5-bullet executive plan." }
];

let models = [
  "qwen3.6-35b-a3b-w4-mtp",
  "qwen3.6-35b-a3b-w4",
  "qwen3.6-35b-a3b-fp8",
  "inkling-2-mini",
  "omega-llm-15.8m-om2"
];

let state = loadState();
const controllers = new Map();
let nextId = state.bots.reduce((m, b) => Math.max(m, b.id), 0) + 1;

function makePresetBots(count) {
  const arr = [];
  for (let i = 0; i < count; i++) {
    const p = PRESET_ROLES[i % PRESET_ROLES.length];
    arr.push({
      id: i + 1,
      name: p.name + (i >= PRESET_ROLES.length ? " " + (i + 1) : ""),
      model: p.model || "",
      sys: p.sys || "",
      active: true,
      messages: [],
      meta: "Idle"
    });
  }
  return arr;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.bots) && parsed.bots.length) return parsed;
    }
  } catch {}
  return {
    globalModel: "qwen3.6-35b-a3b-w4-mtp",
    cols: 2,
    bots: makePresetBots(4)
  };
}

function saveState() {
  try {
    const slim = {
      globalModel: state.globalModel,
      cols: state.cols,
      bots: state.bots.map(b => ({
        id: b.id, name: b.name, model: b.model, sys: b.sys, active: b.active,
        messages: b.messages.slice(-16), meta: b.meta
      }))
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(slim));
  } catch {}
}

function effectiveModel(bot) {
  return bot.model || state.globalModel;
}

function updateModePill(health) {
  const pill = document.getElementById("modePill");
  const dot = document.getElementById("healthDot");
  if (!health) {
    pill.textContent = "Router unreachable";
    pill.className = "pill";
    dot.style.background = "var(--danger)";
    return;
  }
  dot.style.background = "var(--ok)";
  const gpu = health.active_gpu_model || "none";
  const gm = state.globalModel;
  const conc = gm === "inkling-2-mini"
    ? "⚡ 8-Slot Lockstep GPU"
    : gm === "omega-llm-15.8m-om2"
      ? "⚡ Grace CPU :18098"
      : "⚡ Pipelined GPU + Parallel CPU";
  pill.textContent = `GPU: ${gpu} · ${conc}`;
  pill.className = "pill live";
}

async function pollHealth() {
  try {
    const r = await fetch("/health", { cache: "no-store" });
    if (r.ok) updateModePill(await r.json());
  } catch {
    updateModePill(null);
  }
}

async function fetchModels() {
  try {
    const r = await fetch("/v1/models", { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      const ids = (d.data || []).map(x => x.id).filter(Boolean);
      if (ids.length) models = ids;
    }
  } catch {}
  const sel = document.getElementById("globalModel");
  sel.innerHTML = "";
  for (const m of models) {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;
    if (m === state.globalModel) opt.selected = true;
    sel.appendChild(opt);
  }
  if (!models.includes(state.globalModel) && models.length) {
    state.globalModel = models[0];
    sel.value = state.globalModel;
  }
}

function renderMessageEl(m) {
  const div = document.createElement("div");
  div.className = "msg " + m.role;
  div.textContent = m.content;
  return div;
}

function renderDeck() {
  const deck = document.getElementById("deck");
  const n = state.bots.length;
  const cols = n <= 2 ? 2 : n <= 4 ? 2 : n <= 6 ? 3 : 4;
  state.cols = cols;
  deck.style.setProperty("--cols", String(cols));
  deck.innerHTML = "";

  for (const bot of state.bots) {
    const card = document.createElement("section");
    card.className = "bot-card" + (bot.active ? "" : " inactive");
    card.dataset.botId = String(bot.id);

    const hdr = document.createElement("div");
    hdr.className = "bot-hdr";

    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = bot.active;
    chk.title = "Include in concurrent broadcast waves";
    chk.addEventListener("change", () => {
      bot.active = chk.checked;
      card.classList.toggle("inactive", !bot.active);
      saveState();
    });

    const nameIn = document.createElement("input");
    nameIn.className = "bot-name";
    nameIn.value = bot.name;
    nameIn.setAttribute("aria-label", "Bot name");
    nameIn.addEventListener("input", () => { bot.name = nameIn.value; saveState(); });

    const msel = document.createElement("select");
    msel.className = "bot-model";
    msel.setAttribute("aria-label", "Bot model");
    const defOpt = document.createElement("option");
    defOpt.value = "";
    defOpt.textContent = "Global (" + state.globalModel.replace("qwen3.6-35b-a3b-", "q36-") + ")";
    if (!bot.model) defOpt.selected = true;
    msel.appendChild(defOpt);
    for (const m of models) {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      if (bot.model === m) opt.selected = true;
      msel.appendChild(opt);
    }
    msel.addEventListener("change", () => { bot.model = msel.value; saveState(); });

    const clrBtn = document.createElement("button");
    clrBtn.type = "button";
    clrBtn.className = "small";
    clrBtn.textContent = "Clear";
    clrBtn.addEventListener("click", () => {
      bot.messages = [];
      bot.meta = "Idle";
      saveState();
      renderDeck();
    });

    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "small";
    delBtn.textContent = "×";
    delBtn.title = "Remove bot pane";
    delBtn.addEventListener("click", () => {
      stopBot(bot.id);
      state.bots = state.bots.filter(x => x.id !== bot.id);
      if (!state.bots.length) state.bots = makePresetBots(2);
      saveState();
      renderDeck();
    });

    hdr.append(chk, nameIn, msel, clrBtn, delBtn);

    const sysWrap = document.createElement("details");
    sysWrap.className = "bot-sys-wrap";
    const sum = document.createElement("summary");
    const roleLabel = document.createElement("span");
    roleLabel.textContent = bot.sys ? "Role / System Prompt ▾" : "Add Role / System Prompt ▾";
    const metaSpan = document.createElement("span");
    metaSpan.className = "bot-meta";
    metaSpan.id = "meta-" + bot.id;
    metaSpan.textContent = bot.meta || "Idle";
    sum.append(roleLabel, metaSpan);
    const sysTa = document.createElement("textarea");
    sysTa.className = "bot-sys";
    sysTa.value = bot.sys;
    sysTa.placeholder = "Optional system role for this bot...";
    sysTa.addEventListener("input", () => { bot.sys = sysTa.value; saveState(); });
    sysWrap.append(sum, sysTa);

    const log = document.createElement("div");
    log.className = "bot-log";
    log.id = "log-" + bot.id;
    for (const m of bot.messages) log.appendChild(renderMessageEl(m));

    const foot = document.createElement("div");
    foot.className = "bot-foot";
    const inp = document.createElement("input");
    inp.className = "bot-input";
    inp.placeholder = `Message ${bot.name}...`;
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const txt = inp.value.trim();
        if (txt) { inp.value = ""; runSingleBot(bot, txt); }
      }
    });
    const sendBtn = document.createElement("button");
    sendBtn.type = "button";
    sendBtn.className = "small primary";
    sendBtn.textContent = "Send";
    sendBtn.addEventListener("click", () => {
      const txt = inp.value.trim();
      if (txt) { inp.value = ""; runSingleBot(bot, txt); }
    });
    const stopBtn = document.createElement("button");
    stopBtn.type = "button";
    stopBtn.className = "small danger";
    stopBtn.textContent = "■";
    stopBtn.title = "Stop this bot";
    stopBtn.addEventListener("click", () => stopBot(bot.id));

    foot.append(inp, sendBtn, stopBtn);
    card.append(hdr, sysWrap, log, foot);
    deck.appendChild(card);
    log.scrollTop = log.scrollHeight;
  }
}

function setBotMeta(bot, text, streaming) {
  bot.meta = text;
  const el = document.getElementById("meta-" + bot.id);
  if (el) el.textContent = text;
  const card = document.querySelector(`.bot-card[data-bot-id="${bot.id}"]`);
  if (card) card.classList.toggle("streaming", !!streaming);
}

function appendMessageToDom(bot, role, content) {
  const m = { role, content };
  bot.messages.push(m);
  const log = document.getElementById("log-" + bot.id);
  let el = null;
  if (log) {
    el = renderMessageEl(m);
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }
  return { msg: m, el, log };
}

function stopBot(botId) {
  const ac = controllers.get(botId);
  if (ac) { ac.abort(); controllers.delete(botId); }
}

function stopAll() {
  for (const [id, ac] of controllers.entries()) {
    ac.abort();
    controllers.delete(id);
  }
  const wp = document.getElementById("wavePill");
  wp.textContent = "Wave: stopped";
  wp.className = "pill";
}

function buildApiMessages(bot) {
  const out = [];
  if (bot.sys && bot.sys.trim()) out.push({ role: "system", content: bot.sys.trim() });
  for (const m of bot.messages) {
    if (m.role === "user" || m.role === "assistant") out.push({ role: m.role, content: m.content });
  }
  return out;
}

async function runSingleBot(bot, promptText) {
  stopBot(bot.id);
  appendMessageToDom(bot, "user", promptText);
  const { msg, el, log } = appendMessageToDom(bot, "assistant", "");
  const ac = new AbortController();
  controllers.set(bot.id, ac);

  const model = effectiveModel(bot);
  const max_tokens = Number(document.getElementById("maxTokens").value) || 2048;
  const apiMsgs = buildApiMessages(bot).slice(0, -1); // exclude empty assistant placeholder
  setBotMeta(bot, `Streaming (${model})…`, true);

  const t0 = performance.now();
  let tFirst = null;
  let chunks = 0;
  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages: apiMsgs, max_tokens, stream: true }),
      signal: ac.signal
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const ctype = resp.headers.get("content-type") || "";
    if (!ctype.includes("text/event-stream")) {
      const obj = await resp.json();
      tFirst = performance.now();
      msg.content = obj?.choices?.[0]?.message?.content || "";
      if (el) el.textContent = msg.content;
      chunks = obj?.usage?.completion_tokens || 1;
    } else {
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n")) !== -1) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line.startsWith("data: ")) continue;
          const pl = line.slice(6);
          if (pl === "[DONE]") continue;
          try {
            const obj = JSON.parse(pl);
            const tok = obj?.choices?.[0]?.delta?.content;
            if (tok) {
              if (tFirst === null) tFirst = performance.now();
              msg.content += tok;
              chunks++;
              if (el) el.textContent = msg.content;
              if (log) log.scrollTop = log.scrollHeight;
            }
          } catch {}
        }
      }
    }
    const tEnd = performance.now();
    const ttft = ((tFirst ?? tEnd) - t0) / 1000;
    const genS = Math.max((tEnd - (tFirst ?? t0)) / 1000, 0.001);
    const tps = chunks / genS;
    setBotMeta(bot, `${chunks} tok · TTFT ${ttft.toFixed(2)}s · ${tps.toFixed(1)} tok/s`, false);
    saveState();
    return { chunks, elapsedS: (tEnd - t0) / 1000 };
  } catch (err) {
    if (err.name === "AbortError") {
      setBotMeta(bot, "Stopped", false);
    } else {
      msg.role = "error";
      msg.content = `[Error: ${err.message}]`;
      if (el) { el.className = "msg error"; el.textContent = msg.content; }
      setBotMeta(bot, `Error: ${err.message}`, false);
    }
    saveState();
    return { chunks, elapsedS: 0 };
  } finally {
    controllers.delete(bot.id);
    pollHealth();
  }
}

async function runInklingBatch(bots, promptText) {
  const ac = new AbortController();
  const holders = bots.map(bot => {
    stopBot(bot.id);
    controllers.set(bot.id, ac);
    appendMessageToDom(bot, "user", promptText);
    const h = appendMessageToDom(bot, "assistant", "");
    setBotMeta(bot, "⚡ Lockstep GPU Slot…", true);
    return { bot, ...h, chunks: 0, tFirst: null };
  });

  const prompts = bots.map(b => (b.sys ? b.sys.trim() + "\n\n" : "") + promptText);
  const t0 = performance.now();
  try {
    const resp = await fetch("/v1/batch-chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "inkling-2-mini", prompts }),
      signal: ac.signal
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) !== -1) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith("data: ")) continue;
        const pl = line.slice(6);
        if (pl === "[DONE]") continue;
        try {
          const obj = JSON.parse(pl);
          const h = holders[obj.slot];
          if (!h) continue;
          if (obj.delta) {
            if (h.tFirst === null) h.tFirst = performance.now();
            h.msg.content += obj.delta;
            h.chunks++;
            if (h.el) h.el.textContent = h.msg.content;
            if (h.log) h.log.scrollTop = h.log.scrollHeight;
          }
          if (obj.done) {
            const dt = Math.max((performance.now() - (h.tFirst ?? t0)) / 1000, 0.001);
            setBotMeta(h.bot, `${h.chunks} tok · ${(h.chunks / dt).toFixed(1)} tok/s (lockstep)`, false);
          }
        } catch {}
      }
    }
    const totChunks = holders.reduce((s, h) => s + h.chunks, 0);
    for (const h of holders) {
      if (h.bot.meta.includes("Lockstep")) {
        const dt = Math.max((performance.now() - (h.tFirst ?? t0)) / 1000, 0.001);
        setBotMeta(h.bot, `${h.chunks} tok · ${(h.chunks / dt).toFixed(1)} tok/s (lockstep)`, false);
      }
    }
    saveState();
    return totChunks;
  } catch (err) {
    for (const h of holders) {
      if (err.name === "AbortError") setBotMeta(h.bot, "Stopped", false);
      else {
        h.msg.role = "error";
        h.msg.content = `[Error: ${err.message}]`;
        if (h.el) { h.el.className = "msg error"; h.el.textContent = h.msg.content; }
        setBotMeta(h.bot, `Error: ${err.message}`, false);
      }
    }
    saveState();
    return 0;
  } finally {
    for (const b of bots) controllers.delete(b.id);
    pollHealth();
  }
}

async function runBroadcast() {
  const box = document.getElementById("broadcastInput");
  const promptText = box.value.trim();
  if (!promptText) return;
  const activeBots = state.bots.filter(b => b.active);
  if (!activeBots.length) return;
  box.value = "";

  const wp = document.getElementById("wavePill");
  wp.textContent = `Wave: running ${activeBots.length} bots…`;
  wp.className = "pill busy";
  const t0 = performance.now();

  const ik2Bots = activeBots.filter(b => effectiveModel(b) === "inkling-2-mini").slice(0, 8);
  const otherBots = activeBots.filter(b => !ik2Bots.includes(b));

  const tasks = [];
  if (ik2Bots.length >= 2) {
    tasks.push(runInklingBatch(ik2Bots, promptText));
  } else {
    for (const b of ik2Bots) tasks.push(runSingleBot(b, promptText).then(r => r.chunks));
  }
  for (const b of otherBots) {
    tasks.push(runSingleBot(b, promptText).then(r => r.chunks));
  }

  const counts = await Promise.all(tasks);
  const totTok = counts.reduce((a, b) => a + (b || 0), 0);
  const dt = Math.max((performance.now() - t0) / 1000, 0.001);
  wp.textContent = `Wave: ${activeBots.length} bots · ${totTok} tok · ${(totTok / dt).toFixed(1)} tok/s agg`;
  wp.className = "pill live";
}

document.getElementById("globalModel").addEventListener("change", (e) => {
  state.globalModel = e.target.value;
  saveState();
  renderDeck();
  pollHealth();
});

for (const btn of document.querySelectorAll("button[data-preset]")) {
  btn.addEventListener("click", () => {
    stopAll();
    const count = Number(btn.dataset.preset);
    state.bots = makePresetBots(count);
    nextId = count + 1;
    saveState();
    renderDeck();
  });
}

document.getElementById("addBotBtn").addEventListener("click", () => {
  if (state.bots.length >= 8) return;
  const p = PRESET_ROLES[state.bots.length % PRESET_ROLES.length];
  state.bots.push({
    id: nextId++,
    name: p.name + " " + nextId,
    model: "",
    sys: p.sys || "",
    active: true,
    messages: [],
    meta: "Idle"
  });
  saveState();
  renderDeck();
});

document.getElementById("clearAllBtn").addEventListener("click", () => {
  stopAll();
  for (const b of state.bots) { b.messages = []; b.meta = "Idle"; }
  saveState();
  renderDeck();
});

document.getElementById("runAllBtn").addEventListener("click", runBroadcast);
document.getElementById("stopAllBtn").addEventListener("click", stopAll);
document.getElementById("broadcastInput").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    runBroadcast();
  }
});

(async () => {
  await fetchModels();
  renderDeck();
  await pollHealth();
  setInterval(pollHealth, 5000);
})();
</script>
